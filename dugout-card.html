<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>AOB Dugout Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
  <style>
    :root {
      --aob-red: rgb(127, 54, 48);
      --aob-gray: rgb(114, 114, 114);
      --row-h: 0.39in;
      --bar-h: 0.26in;
      --score-row-h: 0.26in;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 9pt;
      background: #e8e8e8;
      padding: 0.5in;
    }

    .card {
      position: relative;
      width: 8.5in;
      height: 11in;
      background: white;
      margin: 0 auto 0.5in;
      padding: 0.3in 0.4in;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6.2in;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    .card > *:not(.watermark) {
      position: relative;
      z-index: 1;
    }

    .card-top {
      text-align: center;
      flex-shrink: 0;
    }

    .card-top img {
      height: 1.2in;
      width: auto;
    }

    .top-meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.3in;
      align-items: end;
      margin: 0.08in 0 0.1in;
      flex-shrink: 0;
    }

    .meta-fields .field {
      display: flex;
      align-items: baseline;
      gap: 0.08in;
      margin-bottom: 0.1in;
      font-size: 10pt;
      font-weight: bold;
    }

    .meta-fields .field:last-child { margin-bottom: 0; }

    .meta-fields .field input {
      flex: 1;
      border: none;
      border-bottom: 1px solid #000;
      font-size: 10pt;
      background: transparent;
      min-width: 0;
      max-width: 2.6in;
    }

    /* Innings score grid */
    .score-grid {
      border-collapse: collapse;
      font-size: 7.5pt;
    }

    .score-grid th,
    .score-grid td {
      border: 1px solid #000;
      width: 0.34in;
      height: var(--score-row-h);
      text-align: center;
      font-weight: bold;
    }

    .score-grid .score-label {
      width: 0.75in;
      text-align: left;
      padding-left: 4px;
      font-size: 7pt;
    }

    .score-grid input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 8pt;
    }

    /* Two-column main area */
    .main {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 0.25in;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    .col-left, .col-right {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .subtitle {
      font-family: 'Graduate', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: var(--aob-red);
      font-size: 15pt;
      letter-spacing: 0.06em;
      margin-bottom: 0.06in;
      flex-shrink: 0;
    }

    /* Shared table styling */
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      flex-shrink: 0;
    }

    .grid-table th {
      background: var(--aob-red);
      color: white;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 9pt;
      letter-spacing: 0.05em;
      height: var(--bar-h);
      border: 1px solid #000;
      text-align: center;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .grid-table td {
      border: 1px solid #000;
      height: var(--row-h);
      vertical-align: middle;
      padding: 0;
    }

    .grid-table td input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-size: 9.5pt;
      padding: 0 3px;
    }

    .grid-table .center input { text-align: center; }

    .order-cell {
      text-align: center;
      font-weight: bold;
      font-size: 11pt;
    }

    /* Lineup column widths */
    .lineup .col-jersey { width: 11%; }
    .lineup .col-order { width: 9%; }
    .lineup .col-player { width: 65%; }
    .lineup .col-pos { width: 15%; }

    .lineup th.subs-bar {
      font-size: 10pt;
      letter-spacing: 0.12em;
    }

    /* Bullpen column widths */
    .bullpen .col-jersey { width: 13%; }
    .bullpen .col-name { width: 72%; }
    .bullpen .col-extra { width: 15%; }

    /* Trackers: BASE2 tally + QAB box */
    .trackers {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 0.15in;
      margin-top: 0.12in;
      flex-shrink: 0;
    }

    .tracker-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 8pt;
    }

    .tracker-table th,
    .tracker-table td {
      border: 1px solid #000;
      height: 0.24in;
      text-align: center;
      font-weight: bold;
      padding: 0;
    }

    .tracker-table th {
      font-size: 7.5pt;
      letter-spacing: 0.05em;
    }

    .tracker-table td input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 8.5pt;
    }

    .qab-label {
      text-align: left !important;
      padding-left: 4px !important;
    }

    /* Notes box */
    .notes {
      border: 1px solid #000;
      margin-top: 0.12in;
      padding: 0.05in;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 1in;
    }

    .notes-label {
      font-weight: bold;
      font-size: 10pt;
      flex-shrink: 0;
    }

    .notes textarea {
      flex: 1;
      border: none;
      background: transparent;
      resize: none;
      font-family: inherit;
      font-size: 9pt;
      margin-top: 0.04in;
    }

    .card-footer {
      flex-shrink: 0;
      margin-top: 0.08in;
      font-size: 7pt;
      color: var(--aob-gray);
      letter-spacing: 0.05em;
    }

    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; margin: 0; page-break-after: always; }
      .card:last-child { page-break-after: auto; }
    }

    @page { size: letter portrait; margin: 0; }
  </style>
</head>
<body>

<div class="card">
  <img class="watermark" src="/img/aob-logo-text.svg" alt="">

  <div class="card-top">
    <img src="/img/aob-logo-text.svg" alt="Academy of Baseball">
  </div>

  <div class="top-meta">
    <div class="meta-fields">
      <div class="field"><label>DATE:</label><input type="text"></div>
      <div class="field"><label>OPPONENT:</label><input type="text"></div>
    </div>
    <table class="score-grid">
      <tr>
        <th class="score-label"></th>
        <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th>
      </tr>
      <tr>
        <td class="score-label">VISITOR</td>
        <td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td>
      </tr>
      <tr>
        <td class="score-label">HOME</td>
        <td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td>
      </tr>
    </table>
  </div>

  <div class="main">
    <div class="col-left">
      <div class="subtitle">CAIMANS BASEBALL</div>

      <table class="grid-table lineup">
        <colgroup>
          <col class="col-jersey">
          <col class="col-order">
          <col class="col-player">
          <col class="col-pos">
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th colspan="2">Starting Lineup</th>
            <th>Pos</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="center"><input type="text"></td><td class="order-cell">1</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">2</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">3</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">4</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">5</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">6</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">7</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">8</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">9</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td class="order-cell">P</td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
        </tbody>
        <tbody>
          <tr><th class="subs-bar" colspan="4">Subs</th></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
        </tbody>
      </table>
    </div>

    <div class="col-right">
      <table class="grid-table bullpen">
        <colgroup>
          <col class="col-jersey">
          <col class="col-name">
          <col class="col-extra">
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>Bullpen Arms</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
          <tr><td class="center"><input type="text"></td><td><input type="text"></td><td class="center"><input type="text"></td></tr>
        </tbody>
      </table>

      <div class="trackers">
        <table class="tracker-table">
          <tr><th>AOB</th><th></th><th>VIS</th></tr>
          <tr><td><input type="text"></td><td>B</td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td>A</td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td>S</td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td>E</td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td>2</td><td><input type="text"></td></tr>
        </table>
        <table class="tracker-table">
          <tr><th class="qab-label" colspan="2">QAB</th></tr>
          <tr><td><input type="text"></td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td><input type="text"></td></tr>
          <tr><td><input type="text"></td><td><input type="text"></td></tr>
        </table>
      </div>

      <div class="notes">
        <div class="notes-label">Notes:</div>
        <textarea></textarea>
      </div>
    </div>
  </div>

  <div class="card-footer">academyofbaseball.org</div>
</div>

</body>
</html>
